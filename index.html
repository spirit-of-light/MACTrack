<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>MacTracker</title>
<style>
  /* Tokens: ai-factory/designs/frontend.md */
  :root {
    --primary: #7A013C; --primary-hover: #5E012E; --primary-tint: #F6E6EE; --on-primary: #FFFFFF;
    --bg: #FFFFFF; --surface: #FAFAFA; --text: #222222; --text-muted: #666666; --text-faint: #888888; --border: #EEEEEE;
    --overdue-bg: #FBD5D5; --upcoming-bg: #FFF3C4; --banner-bg: #FDE2E1; --banner-border: #E0A3A0;
  }
  body { font: 14px system-ui, sans-serif; margin: 1.5rem; color: var(--text); background: var(--bg); }
  h1 { color: var(--primary); font-size: 1.5rem; }
  a { color: var(--primary); }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  button { background: var(--primary); color: var(--on-primary); border: 0; padding: .25rem .7rem; font: inherit; cursor: pointer; }
  button:hover, button:active { background: var(--primary-hover); }
  #add { background: var(--surface); padding: .4rem .6rem; }
  #edit { display: inline-flex; align-items: center; gap: .3rem; margin-top: 1rem; }
  .banner { background: var(--banner-bg); border: 1px solid var(--banner-border); padding: .4rem .6rem; margin: .3rem 0; }
  #sources { margin-top: 2rem; width: auto; color: var(--text-muted); }
  /* Item list with the filter sidebar on its right; the sidebar stays in view while the list scrolls */
  #layout { display: grid; grid-template-columns: minmax(0, 1fr) 18rem; gap: 1.5rem; align-items: start; }
  /* Calendar and sidebar both stay in view while the list scrolls under the calendar */
  #cal-wrap { position: sticky; top: 0; z-index: 1; background: var(--bg); padding-bottom: .4rem; }
  #filters { position: sticky; top: 0; padding-top: 1rem; display: flex; flex-direction: column; gap: 1rem; }
  .chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .3rem; }
  #statuses { grid-template-columns: 1fr; }
  /* Edit mode needs the full width for its inputs, so the filters go above the list in a row; same on narrow screens */
  #layout.editing { grid-template-columns: 1fr; }
  #layout.editing #filters { position: static; order: -1; padding-top: 0; flex-direction: row; flex-wrap: wrap; align-items: start; }
  #layout.editing .chips { width: 18rem; }
  #layout.editing #courses { width: 24rem; }
  @media (max-width: 900px) { #layout { grid-template-columns: 1fr; } #filters { position: static; order: -1; } }
  .chips > span { display: flex; }
  .chips > span > button:first-child { flex: 1; }
  .chips button { background: var(--bg); color: var(--text); border: 1px solid var(--text-faint);
    border-left: 4px solid var(--c, var(--text-faint)); }
  .chips button:hover { background: var(--primary-tint); }
  .chips button[aria-pressed=true] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .chips .off { opacity: .5; }
  td.course { color: var(--c); font-weight: 600; white-space: nowrap; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: .15rem .3rem; border-bottom: 1px solid var(--border); }
  td input { width: 100%; box-sizing: border-box; font: inherit; }
  td input[type=number] { width: 5em; }
  td input[type=checkbox] { width: auto; margin: 0; }
  /* Item list: fixed column widths so filtering never shifts columns; Title takes the rest */
  #items { table-layout: fixed; }
  #items td { overflow-wrap: anywhere; }
  #items th:first-child, #items td:first-child { padding: 0 2px; text-align: center; }
  col.done { width: var(--tick, 1.2em); } /* checkmark width + 4px, measured at load */
  col.type { width: 6.5rem; } col.course { width: 8rem; } col.due { width: 9.5rem; } col.left { width: 7.5rem; }
  col.weight { width: 4.5rem; } col.mark { width: 6rem; } col.source { width: 6.5rem; } col.actions { width: 8.5rem; }
  .editing col.done { width: 17px; } .editing col.due { width: 13.5rem; } .editing col.weight { width: 6rem; }
  .editing col.mark { width: 11rem; }
  /* Due cell: date right-aligned in a slot as wide as the widest date, so the dots line up */
  div.due { display: grid; grid-template-columns: var(--date-w, max-content) 6px max-content; gap: .35em; align-items: center; }
  div.due span:first-child { text-align: right; }
  div.due svg { width: 6px; height: 6px; }
  tr.overdue { background: var(--overdue-bg); }
  tr.upcoming { background: var(--upcoming-bg); }
  tr.missing { opacity: .55; }
  .src { color: var(--text-faint); font-size: .85em; }
  .info { color: var(--text-muted); margin: 0 0 .3rem; }
  #cal-nav { display: flex; align-items: center; gap: .3rem; padding: 1rem 0 .4rem; margin: 0; }
  #cal-nav label { margin-left: .8rem; }
  /* 7 equal columns whatever N is; more days wrap to new rows; every row as tall as the tallest */
  #calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 1fr;
    border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
  .day { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: .3rem .4rem;
    min-height: 5rem; overflow-wrap: anywhere; }
  .day h3 { font-size: .9rem; margin: 0 0 .3rem; }
  .day.today h3 { color: var(--primary); }
  .day p { margin: 0 0 .3rem; border-left: 4px solid var(--c); padding-left: .3rem; font-size: .9em; }
  .chips button.eye, .chips button.eye:hover { background: none; color: var(--c); border: 0; padding: 0 .2rem; vertical-align: middle; }
  tr.off { opacity: .5; }
  .day p.done { text-decoration: line-through; color: var(--text-muted); }
</style>
<h1>MacTracker</h1>
<div id="banners"></div>
<form id="add">
  <strong>Add item</strong>
  <input name="course" list="known-courses" placeholder="Course" required>
  <datalist id="known-courses"></datalist>
  <input name="title" placeholder="Title" required>
  <select name="kind"><option value="">kind from title</option></select>
  <input name="due" type="datetime-local">
  <input name="weight" type="number" step="any" placeholder="Weight" style="width:5em">
  <input name="mark" type="number" step="any" placeholder="Mark" style="width:5em">
  <input name="out_of" type="number" step="any" placeholder="Out of" style="width:5em">
  <button>Add</button>
</form>
<div id="layout">
<main>
  <div id="cal-wrap">
    <nav id="cal-nav">
      <button id="cal-back" aria-label="Previous days">←</button>
      <button id="cal-today">Today</button>
      <button id="cal-fwd" aria-label="Next days">→</button>
      <label>Upcoming window (days) <input id="days" type="number" min="1" style="width:4em"></label>
    </nav>
    <div id="calendar"></div>
  </div>
  <p id="summary" class="info"></p>
  <table id="items"><colgroup id="cols"></colgroup><thead id="head"></thead><tbody id="list"></tbody></table>
</main>
<aside id="filters">
  <div id="courses" class="chips" role="group" aria-label="Course"></div>
  <div id="kinds" class="chips" role="group" aria-label="Type"></div>
  <div id="statuses" class="chips" role="group" aria-label="Status"></div>
</aside>
</div>
<table id="sources">
  <thead><tr><th>Website</th><th>Status</th><th>Last synced</th></tr></thead>
  <tbody></tbody>
</table>
<button id="edit"></button>
<script>
'use strict';
// Spec 0002 AC16: copy of extension/parse.js SITES[*].login; Crowdmark signs in through Avenue (session default).
const LOGIN = {
  avenue: 'https://avenue.mcmaster.ca/login.php?target=%2Fd2l%2Fhome',
  crowdmark: 'https://avenue.mcmaster.ca/login.php?target=%2Fd2l%2Fhome',
  childsmath: 'https://login.microsoftonline.com/44376307-b429-42ad-8c25-28cd496f4772/oauth2/v2.0/authorize?client_id=9132e1a8-fef6-4c34-bddb-de7608a2381a&response_type=code&response_mode=query&scope=https%3A%2F%2Fgraph.microsoft.com%2FUser.Read',
};
const KINDS = ['exam', 'midterm', 'test', 'quiz', 'lab', 'assignment', 'homework', 'other']; // practice is not tracked
const TYPE_BUTTONS = KINDS.filter((k) => k !== 'midterm' && k !== 'homework'); // still stored and editable, just no filter button
const $ = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const days = () => Number(localStorage.getItem('upcomingDays')) || 7; // AC41/AC42/AC51: browser only
const round2 = (v) => (v == null ? '' : Math.round(v * 100) / 100); // display only; edit mode keeps the exact value
const editing = () => localStorage.getItem('editMode') === '1'; // view mode by default; browser only
const hiddenCourses = () => { try { return JSON.parse(localStorage.getItem('hiddenCourses')) || []; } catch { return []; } }; // browser only
const setHidden = (list) => { localStorage.setItem('hiddenCourses', JSON.stringify(list)); render(); };
const icon = (d) => { // stroked 24px SVG from one path; built with DOM calls, never parsed from a string
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  const path = document.createElementNS(ns, 'path');
  for (const [k, v] of Object.entries({ viewBox: '0 0 24 24', width: 18, height: 18, fill: 'none', stroke: 'currentColor',
    'stroke-width': 2, 'aria-hidden': 'true' })) svg.setAttribute(k, v);
  path.setAttribute('d', d);
  svg.append(path);
  return svg;
};
const EYE = 'M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12zM15 12a3 3 0 1 1-6 0a3 3 0 1 1 6 0';
const PENCIL = 'M16.5 3.5l4 4L8 20H4v-4L16.5 3.5z';
const PAGE = 'M14 2H5v20h14V7l-5-5zM14 2v5h5M8 13h8M8 17h8';
const EYE_SHUT = 'M2 10c3 4 6.5 6 10 6s7-2 10-6M5 13l-2 3M12 16v3M19 13l2 3';
let data = { items: [], courses: {} };
let status = {};
let calOffset = 0; // calendar start, in days from today; not saved
let course = ''; // course and type filters; '' is All; not saved
let kind = '';
let state = ''; // status filter
const STATES = { open: 'Not done', done: 'Done', overdue: 'Overdue' };

const dueMs = (i) => (i.due ? new Date(i.due).getTime() : Infinity);
const overdue = (i) => !i.done && dueMs(i) < Date.now();
const upcoming = (i) => !i.done && dueMs(i) >= Date.now() && dueMs(i) <= Date.now() + days() * 864e5;
const courseOf = (i) => i.course ?? '(no course)';
const left = (i) => { // time until due, e.g. "3d 4h" or "5h 20m"; computed at render
  if (i.done || !i.due) return '';
  const ms = dueMs(i) - Date.now();
  const m = Math.floor(Math.abs(ms) / 6e4);
  const t = m >= 1440 ? `${Math.floor(m / 1440)}d ${Math.floor(m / 60) % 24}h` : `${Math.floor(m / 60)}h ${m % 60}m`;
  return ms < 0 ? `${t} overdue` : t;
};
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const pad = (n) => String(n).padStart(2, '0');
const dueText = (iso, now = new Date()) => { // ["dd Mon", "hh:mm"], with the year only when it is not this year
  if (!iso) return [];
  const d = new Date(iso);
  const year = d.getFullYear() === now.getFullYear() ? '' : ` ${d.getFullYear()}`;
  return [`${pad(d.getDate())} ${MONTHS[d.getMonth()]}${year}`, `${pad(d.getHours())}:${pad(d.getMinutes())}`];
};
const DOT = 'M12 8a4 4 0 1 1 0 8a4 4 0 1 1 0-8z';
const markText = (i) => (i.mark == null ? '' : i.out_of == null ? round2(i.mark) : `${round2(i.mark)} / ${round2(i.out_of)}`);
const localInput = (iso) => { // ISO -> value for <input type=datetime-local>
  if (!iso) return '';
  const d = new Date(iso);
  return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
};

async function load() {
  [data, status] = await Promise.all([
    fetch('/api/items').then((r) => r.json()),
    fetch('/api/status').then((r) => r.json()),
  ]);
  render();
}

const raw = (input) => (input.type === 'checkbox' ? input.checked : input.value);
const parsed = (input) => (input.type === 'checkbox' ? input.checked
  : input.type === 'number' ? (input.value === '' ? null : Number(input.value))
  : input.type === 'datetime-local' ? (input.value ? new Date(input.value).toISOString() : null)
  : input.value);

// AC31: send only the fields the user changed, then reload.
async function save(item, inputs, orig) {
  const fields = {};
  for (const [k, input] of Object.entries(inputs)) if (raw(input) !== orig[k]) fields[k] = parsed(input);
  if (!Object.keys(fields).length) return;
  const r = await fetch(`/api/items/${item.id}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(fields),
  });
  if (!r.ok) alert(`Save failed: ${r.status}`);
  load();
}

// AC105/AC111: add a manual item; empty optional fields are left out.
async function add(ev) {
  ev.preventDefault();
  const body = {};
  for (const input of ev.target.querySelectorAll('[name]')) {
    const v = parsed(input);
    if (v !== null && v !== '') body[input.name] = v;
  }
  const r = await fetch('/api/items', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  if (!r.ok) return alert(`Add failed: ${r.status}`);
  ev.target.reset();
  load();
}

// AC108: only manual items can be deleted.
async function remove(item) {
  if (!confirm(`Delete "${item.title}"?`)) return;
  const r = await fetch(`/api/items/${item.id}/delete`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
  });
  if (!r.ok) alert(`Delete failed: ${r.status}`);
  load();
}

function row(item) {
  if (!editing()) { // view mode: plain text, no controls
    const tr = $('tr', {}, ...[item.done ? '✓' : '', item.kind ?? '', courseOf(item),
      (item.title ?? '') + (item.missing ? ' (missing from source)' : ''),
      '', left(item), round2(item.weight), markText(item)]
      .map((t) => $('td', { textContent: String(t) })));
    tr.children[2].className = 'course';
    if (item.due) {
      const [date, time] = dueText(item.due);
      const dot = icon(DOT);
      dot.setAttribute('fill', 'currentColor');
      tr.children[4].replaceChildren($('div', { className: 'due' }, $('span', { textContent: date }), dot, $('span', { textContent: time })));
    }
    tr.classList.toggle('overdue', overdue(item));
    tr.classList.toggle('upcoming', upcoming(item));
    tr.classList.toggle('missing', !!item.missing);
    return tr;
  }
  const inputs = {
    done: $('input', { type: 'checkbox', checked: !!item.done }),
    title: $('input', { value: item.title ?? '' }),
    kind: $('select', {}, ...KINDS.map((k) => $('option', { value: k, textContent: k, selected: k === item.kind }))),
    due: $('input', { type: 'datetime-local', value: localInput(item.due) }),
    weight: $('input', { type: 'number', step: 'any', value: item.weight ?? '' }),
    mark: $('input', { type: 'number', step: 'any', value: item.mark ?? '' }),
    out_of: $('input', { type: 'number', step: 'any', value: item.out_of ?? '' }),
  };
  const orig = Object.fromEntries(Object.entries(inputs).map(([k, i]) => [k, raw(i)]));
  const tr = $('tr', {}, $('td', {}, inputs.done), $('td', {}, inputs.kind), $('td', { className: 'course', textContent: courseOf(item) }),
    $('td', {}, inputs.title), $('td', {}, inputs.due), $('td', { textContent: left(item) }), $('td', {}, inputs.weight),
    $('td', {}, inputs.mark, ' / ', inputs.out_of),
    $('td', { className: 'src', textContent: item.source + (item.missing ? ' · missing from source' : '') }),
    $('td', {}, $('button', { textContent: 'Save', onclick: () => save(item, inputs, orig) }),
      ...(item.source === 'manual' ? [$('button', { textContent: 'Delete', onclick: () => remove(item) })] : [])));
  tr.classList.toggle('overdue', overdue(item));
  tr.classList.toggle('upcoming', upcoming(item));
  tr.classList.toggle('missing', !!item.missing);
  return tr;
}

// A row of toggle buttons, All first; the pressed one is the current filter.
const chips = (values, current, pick, label = (v) => v) => ['', ...values].map((v) => {
  const b = $('button', { textContent: v ? label(v) : 'All', onclick: () => { pick(v); render(); } });
  b.setAttribute('aria-pressed', String(v === current));
  return b;
});

// Next days() days from today + calOffset, each with the items due that local day.
function calendar(items, colorOf) {
  const start = new Date();
  start.setHours(0, 0, 0, 0);
  start.setDate(start.getDate() + calOffset);
  return Array.from({ length: days() }, (_, k) => {
    const from = new Date(start);
    from.setDate(start.getDate() + k);
    const to = new Date(from);
    to.setDate(from.getDate() + 1);
    const today = calOffset + k === 0;
    const label = from.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    return $('div', { className: today ? 'day today' : 'day' },
      $('h3', { textContent: today ? `${label} (today)` : label }),
      ...items.filter((i) => dueMs(i) >= from && dueMs(i) < to).sort((a, b) => dueMs(a) - dueMs(b)).map((i) => {
        const c = i.course ?? '(no course)';
        const p = $('p', { className: i.done ? 'done' : '' }, $('b', { textContent: c }), ` ${i.title ?? ''}`);
        p.style.setProperty('--c', colorOf(c));
        return p;
      }));
  });
}

function render() {
  document.getElementById('add').hidden = !editing();
  // Mode switch: pencil + Edit in view mode, page + View in edit mode
  document.getElementById('edit').replaceChildren(icon(editing() ? PAGE : PENCIL), editing() ? 'View' : 'Edit');
  // AC30: one banner per source that needs attention; the other sources still render below.
  document.getElementById('banners').replaceChildren(...Object.entries(status)
    .filter(([, s]) => s.status !== 'ok')
    .map(([src, s]) => (s.status === 'login needed'
      ? $('div', { className: 'banner' }, `${src}: login needed — `,
        $('a', { href: LOGIN[src], target: '_blank', rel: 'noopener', textContent: 'sign in' }), ', then sync again')
      : $('div', { className: 'banner', textContent: `${src}: ${s.status}${s.error ? ` — ${s.error}` : ''}` }))));
  document.querySelector('#sources tbody').replaceChildren(...Object.entries(status).map(([src, s]) => $('tr', {},
    ...[src[0].toUpperCase() + src.slice(1), s.status, new Date(s.synced_at).toLocaleString()].map((t) => $('td', { textContent: t })))));

  const all = [...new Set(data.items.map(courseOf))].sort();
  const hidden = hiddenCourses();
  const visible = all.filter((c) => !hidden.includes(c));
  const courses = editing() ? all : visible; // edit mode lists hidden courses too, so they can be shown again
  if (!courses.includes(course)) course = '';
  document.getElementById('known-courses').replaceChildren(
    ...all.filter((c) => c !== '(no course)').map((c) => $('option', { value: c })));
  const colorOf = (c) => `hsl(${(all.indexOf(c) * 137) % 360} 55% 38%)`; // AC26: page-derived course color; hiding keeps colours

  document.getElementById('courses').replaceChildren(...chips(courses, course, (v) => { course = v; }).map((b, n) => {
    if (!n) return b;
    const c = courses[n - 1];
    b.style.setProperty('--c', colorOf(c));
    if (!editing()) return b;
    const off = hidden.includes(c);
    const eye = $('button', { className: 'eye', title: off ? `Show ${c}` : `Hide ${c}`,
      onclick: () => setHidden(off ? hidden.filter((h) => h !== c) : [...hidden, c]) });
    eye.setAttribute('aria-label', eye.title);
    eye.style.setProperty('--c', colorOf(c));
    eye.append(icon(off ? EYE_SHUT : EYE));
    return $('span', { className: off ? 'off' : '' }, b, eye);
  }));
  document.getElementById('kinds').replaceChildren(...chips(TYPE_BUTTONS, kind, (v) => { kind = v; }));

  document.getElementById('statuses').replaceChildren(...chips(Object.keys(STATES), state, (v) => { state = v; }, (v) => STATES[v]));
  const byStatus = { '': () => true, open: (i) => !i.done, done: (i) => !!i.done, overdue }[state];
  const keep = (i) => byStatus(i) && (!kind || i.kind === kind);
  const picked = (c) => !course || c === course;
  const cal = document.getElementById('calendar');
  cal.replaceChildren(...calendar(data.items.filter((i) => visible.includes(courseOf(i)) && picked(courseOf(i)) && keep(i)), colorOf));

  const g = data.courses[course] || { grade: null, graded_pct: 0 };
  const summary = document.getElementById('summary');
  summary.hidden = !course;
  summary.textContent = [course, ...(g.grade == null ? [] : [`${g.grade.toFixed(1)}%`]), `${(g.graded_pct || 0).toFixed(0)}% Graded`,
    ...(g.approximate ? ['approximate'] : []), ...(g.info || []).map((i) => `${i.name}: ${i.value}`)].join(' | '); // AC29/AC91

  const cols = ['done', 'type', 'course', 'title', 'due', 'left', 'weight', 'mark', ...(editing() ? ['source', 'actions'] : [])];
  document.getElementById('items').classList.toggle('editing', editing());
  document.getElementById('layout').classList.toggle('editing', editing());
  document.getElementById('cols').replaceChildren(...cols.map((c) => $('col', { className: c })));
  const done = $('th', { textContent: '✓', title: 'Done' });
  done.setAttribute('aria-label', 'Done');
  document.getElementById('head').replaceChildren($('tr', {}, done, ...['Type', 'Course', 'Title', 'Due', 'Time left', 'Weight', 'Mark',
    ...(editing() ? ['Source', ''] : [])].map((h) => $('th', { textContent: h }))));
  document.getElementById('list').replaceChildren(...data.items
    .filter((i) => courses.includes(courseOf(i)) && picked(courseOf(i)) && keep(i))
    .sort((a, b) => !!a.done - !!b.done || dueMs(a) - dueMs(b)) // not done first, then by due date
    .map((i) => {
      const tr = row(i);
      tr.style.setProperty('--c', colorOf(courseOf(i)));
      tr.classList.toggle('off', hidden.includes(courseOf(i)));
      return tr;
    }));
  // Line the dots up: size every date slot to the widest date shown, measured with the slot unset
  const list = document.getElementById('items');
  list.style.removeProperty('--date-w');
  const widths = [...list.querySelectorAll('.due span:first-child')].map((e) => e.getBoundingClientRect().width);
  if (widths.length) list.style.setProperty('--date-w', `${Math.ceil(Math.max(...widths))}px`);
}

const daysInput = document.getElementById('days');
daysInput.value = days();
daysInput.addEventListener('change', () => { localStorage.setItem('upcomingDays', daysInput.value); render(); });
document.getElementById('edit').addEventListener('click', () => { localStorage.setItem('editMode', editing() ? '0' : '1'); render(); });
document.querySelector('#add [name=kind]').append(...KINDS.map((k) => $('option', { value: k, textContent: k })));
document.getElementById('add').addEventListener('submit', add);
document.getElementById('cal-back').addEventListener('click', () => { calOffset -= days(); render(); });
document.getElementById('cal-fwd').addEventListener('click', () => { calOffset += days(); render(); });
document.getElementById('cal-today').addEventListener('click', () => { calOffset = 0; render(); });
const tick = document.body.appendChild($('span', { textContent: '✓' })); // size the Done column to the glyph
document.documentElement.style.setProperty('--tick', `${Math.ceil(tick.getBoundingClientRect().width) + 4}px`);
tick.remove();
load();
</script>
</html>
